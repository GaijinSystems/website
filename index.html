<!-- =====================================================================
  PHOSPHOR-9 CONTENT : EDIT THE BLOCK BELOW, IGNORE EVERYTHING AFTER IT.
  The machine behind the glass runs Version 7 Unix (1979): "$ " prompt,
  ls / cat / who / date / mail, and "foo: not found" for unknown commands.

  SETTINGS (at the top, before the first == section ==)
    name:       owner name. Shown as the file owner in ls -l, in who, and as
                the sender in mail. Only the first word is used, max 8 letters.
    email:      contact address, delivered as a letter by the mail command
                (also triggers "you have mail." at login). Leave empty = no mail.
    speed:      printing speed. 1 = original, 1.25 = 25% faster
    uppercase:  no  = normal Unix lowercase
                yes = everything in capitals, like an uppercase-only teletype
    protected:  comma list of locked files shown in ls (cat: can't open).
                Paths work (.trash/core); a trailing / makes a locked folder.
    sound:      on = keyclicks from the start (browsers stay silent until the
                first tap or keypress), off = silent until "sound on"

  CORD (sizes in screen pixels; leave a line out to keep the default)
    cord turns:      number of coil loops                  (default 7)
    cord width:      side-to-side size of the coil         (default 18)
    cord thickness:  thickness of the cord itself          (default 3.2)
    cord gap:        empty space between loops, 0 = touch  (default 1.8)
    cord straight:   straight cable above AND below coil   (default 7.35)
                     (phones only: on desktop the monitor is centered and the
                     cord always reaches the bottom of the window, so the two
                     straight runs grow to fill the gap, still equal)
    cord sway:       idle sway at the coil bottom, 0 = off (default 2.5)

  SECTIONS (a == heading == line, then the lines to print, as written)
    == welcome ==                     message of the day, printed after login
    == about ==                       the "about" file and command
    == command: NAME | HELP TEXT ==   adds a new command (listed in help)
    == command: A, B | HELP TEXT ==   one command with several names
    == file: NAME ==                  adds a file to ls, read with cat NAME
                                      NAME may be a path (notes/todo); folders
                                      are made as needed. Relative paths live in
                                      the home directory /usr/guest; /etc/motd
                                      style absolute paths also work. Names
                                      starting with a dot are hidden (ls -a).
    == dir: NAME ==                   an empty folder (same path rules)
    == aliases ==                     one per line:  new words = real command
                                      e.g.  ll = ls -l   or  cl = clear ; ls
                                      (the alias command lists them;
                                      the longest matching alias wins, extra words pass through)

  INSIDE A SECTION
    ~ line      prints dim green
    ! line      prints red
    text -> https://example.com
                makes the whole line a link (same green, dotted underline;
                opens in a new tab). Works with ~ and ! too. Only http://,
                https:// and mailto: addresses are accepted.
    Blank lines and leading spaces are kept (good for columns).
    Lines starting with # are notes to yourself and are not printed.
    The one thing you cannot write is a closing script tag.
====================================================================== -->

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>PHOSPHOR-9</title>
<style>
:root{
  --phos:#3dff7e;--dim:#1d8f47;--err:#ff5f56;
  /* desktop: the whole monitor (glass + bezel) fits inside 80% of the window's width and
     height, centered. Glass stays 4:3; bezel is 1.079 x 0.842 of the glass width. */
  --sw:min(calc(80vw / 1.079),calc(var(--app-h,100vh) * .8 / .842));
  --sh:calc(var(--sw) * .75);
  --bh:calc(var(--sw) * .842); /* bezel outer height */
  --fs:clamp(13px,calc(var(--sw) / 44.7),32px); /* text scales with the glass (~67 columns) */
  --cable:80px; /* fallback only: the script sets this from the cord settings */
  --nub:11;     /* strain-relief bottom, px below the cable-wrap top */
}
@supports (height:100dvh){:root{--sw:min(calc(80vw / 1.079),calc(var(--app-h,100dvh) * .8 / .842))}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#040504}
body{
  height:100vh;height:100dvh;height:var(--app-h,100dvh); /* --app-h = visible height, shrinks when a soft keyboard opens */
  background:radial-gradient(ellipse 70% 55% at 50% 46%,#09110b 0%,#050705 55%,#030403 100%);
  font-family:"VT323","Courier New",Courier,monospace;
}
#stage{
  position:relative;width:100%;height:100%;margin:0 auto;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}

/* ---------- monitor ---------- */
#bezel{
  position:relative;z-index:2;flex:0 0 auto;
  padding:calc(var(--sw) * .037) calc(var(--sw) * .0395) calc(var(--sw) * .055);
  background:linear-gradient(168deg,#232624 0%,#171917 45%,#0b0c0b 100%);
  border-radius:26px 26px 34px 34px / 22px 22px 44px 44px;
  box-shadow:
    inset 0 2px 1px rgba(255,255,255,.055),
    inset 0 -8px 16px rgba(0,0,0,.65),
    inset 2px 0 3px rgba(255,255,255,.02),
    0 2px 0 #1c1f1d,
    0 34px 70px rgba(0,0,0,.75),
    0 8px 18px rgba(0,0,0,.5);
  -webkit-tap-highlight-color:transparent;
}
#bezel::after{ /* strain relief nub */
  content:"";position:absolute;left:50%;bottom:-15px;width:36px;height:19px;
  transform:translateX(-50%);
  background:linear-gradient(180deg,#1d201e,#0c0d0c);
  border-radius:4px 4px 11px 11px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 5px 8px rgba(0,0,0,.6);
}
.badge{
  position:absolute;left:calc(var(--sw) * .045);bottom:calc(var(--sw) * .017);
  font:max(11px,calc(var(--sw) * .0145))/1 "Courier New",Courier,monospace;letter-spacing:.32em;
  color:#2b2f2c;text-shadow:0 1px 0 rgba(0,0,0,.8),0 -1px 0 rgba(255,255,255,.03);
  user-select:none;pointer-events:none;
}

/* ---------- glass ---------- */
#screen{
  position:relative;width:var(--sw);height:var(--sh);overflow:hidden;
  border-radius:4.5% / 6.5%;
  background:radial-gradient(ellipse at 50% 46%,#07130b 0%,#051009 50%,#020603 100%);
  box-shadow:inset 0 0 40px 12px rgba(0,0,0,.85),inset 0 0 120px rgba(0,0,0,.55),0 0 0 2px #050605;
  -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
  cursor:text;
}
#crt{position:absolute;inset:0;animation:warm 1s cubic-bezier(.2,.7,.2,1) both}
#crt::before{
  content:"";position:absolute;inset:0;z-index:5;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%,rgba(61,255,126,.4),rgba(61,255,126,0) 70%);
  animation:flash 1.1s ease-out forwards;
}
@keyframes warm{0%{transform:scale(.85,.004)}30%{transform:scale(1,.02)}55%{transform:scale(1,1)}100%{transform:none}}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
#crt.lit::before{display:none} /* power-on flash removed outright once it has faded */

#term{
  position:absolute;inset:0;z-index:1;overflow-y:auto;overflow-x:hidden;
  scrollbar-width:none;
}
#term::-webkit-scrollbar{display:none}
#out,.ghost{
  padding:calc(var(--fs)*1.6) calc(var(--fs)*2.1) calc(var(--fs)*1.9);
  font-size:var(--fs);line-height:1.28;
}
.line{
  min-height:1.28em;white-space:pre-wrap;word-break:break-word;
  color:var(--phos);
  text-shadow:0 0 6px rgba(61,255,126,.9),0 0 22px rgba(61,255,126,.35);
}
.line.dim{color:var(--dim);text-shadow:0 0 6px rgba(29,143,71,.8),0 0 18px rgba(29,143,71,.3)}
.line.err{color:var(--err);text-shadow:0 0 6px rgba(255,95,86,.85),0 0 22px rgba(255,95,86,.3)}
.line a{color:inherit;text-decoration:underline dotted;text-underline-offset:.2em;user-select:text;-webkit-user-select:text}
.line a:hover,.line a:focus-visible{text-decoration-style:solid;outline:none}
.cursor{
  display:inline-block;width:.62em;height:1.02em;margin-left:1px;vertical-align:-.17em;
  background:var(--phos);
  box-shadow:0 0 6px rgba(61,255,126,.9),0 0 22px rgba(61,255,126,.35);
}
#term.idle .cursor{animation:blink 1.06s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* afterglow: fading copies of the previous frame (P1 persistence) */
#glow{position:absolute;inset:0;z-index:1;overflow:hidden;pointer-events:none}
.ghost{position:absolute;top:0;left:0;right:0;animation:decay 460ms linear forwards;will-change:opacity}
@keyframes decay{from{opacity:var(--a,.38)}to{opacity:0}}

/* ---------- tube effects ---------- */
.fx{position:absolute;inset:0;pointer-events:none}
.flicker{z-index:2;background:rgba(61,255,126,.03);animation:flick 3.1s steps(1) infinite}
@keyframes flick{
  0%{opacity:.55}6%{opacity:1}9%{opacity:.35}17%{opacity:.8}24%{opacity:.5}
  31%{opacity:1}38%{opacity:.6}46%{opacity:.9}53%{opacity:.3}57%{opacity:.75}
  66%{opacity:.55}74%{opacity:1}79%{opacity:.45}88%{opacity:.85}95%{opacity:.6}
}
.band{position:absolute;left:-4%;right:-4%;z-index:2;pointer-events:none;mix-blend-mode:screen}
.band.b1{height:90px;background:linear-gradient(180deg,rgba(61,255,126,0),rgba(61,255,126,.085) 50%,rgba(61,255,126,0));animation:down 27s linear infinite}
.band.b2{height:150px;background:linear-gradient(180deg,rgba(61,255,126,0),rgba(61,255,126,.03) 50%,rgba(61,255,126,0));animation:up 19s linear infinite}
@keyframes down{0%{top:-90px;transform:skewY(-1.2deg)}50%{transform:skewY(1.2deg)}100%{top:100%;transform:skewY(-1.2deg)}}
@keyframes up{0%{top:100%}100%{top:-150px}}
.scan{z-index:3;background:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.38) 2px,rgba(0,0,0,.38) 3px)}
.vig{z-index:4;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 58%,rgba(0,0,0,.35) 80%,rgba(0,0,0,.8) 100%)}

/* ---------- cable ---------- */
/* desktop: runs from just under the bezel to the bottom of the window, whatever the gap */
#cablewrap{position:absolute;z-index:1;left:0;right:0;bottom:0;top:calc(50% + var(--bh) / 2 - 4px)}
#cable{position:absolute;inset:0;width:100%;height:100%;overflow:visible;display:block}
#sway{transform-box:view-box;transform-origin:50% 0;animation:sway 7.3s ease-in-out infinite}
@keyframes sway{0%,100%{transform:skewX(calc(var(--sa,.5deg) * -1))}50%{transform:skewX(var(--sa,.5deg))}}

/* ---------- hidden input (soft keyboard bridge) ---------- */
#kb{
  position:fixed;left:0;bottom:0;width:1px;height:16px;
  font-size:16px;opacity:0;border:0;padding:0;margin:0;outline:none;
  background:transparent;color:transparent;caret-color:transparent;
}

@media (max-width:640px){
  /* monitor fills the phone down to a short cable; when the soft keyboard opens,
     --app-h shrinks and the whole rig resizes to sit just above it */
  :root{--sw:calc(100vw - 30px);--sh:clamp(140px,calc(var(--app-h,100dvh) - 128px),900px);--fs:clamp(13px,2.2vw,17px);--cable:77px;--nub:8}
  #stage{justify-content:flex-end;padding-top:calc(8px + env(safe-area-inset-top,0px))}
  #cablewrap{position:relative;top:auto;bottom:auto;left:auto;right:auto;width:100%;flex:0 0 var(--cable);margin-top:-4px}
  #bezel{padding:12px 12px 22px;border-radius:16px 16px 22px 22px / 14px 14px 28px 28px}
  #bezel::after{bottom:-12px;width:28px;height:15px}
  .badge{display:none}
}
@media (prefers-reduced-motion:reduce){
  #crt,#crt::before,.flicker,.band,#sway{animation:none}
  #crt::before{display:none}
  .band{display:none}
}
</style>

<script>
(function(){
'use strict';

/* ---------- content (parsed from the block at the top of the file) ---------- */
var PROFILE=(function(){
  var P={name:'OPERATOR',email:'',speed:1,upper:true,sound:true,protected:[],
    cord:{turns:7,width:18,thickness:3.2,gap:1.8,straight:7.35,sway:2.5},welcome:null,about:[],commands:[],files:[],dirs:[],aliases:[]};
  var el=document.getElementById('content'),src=el?el.textContent:'',cur=null,secs=[];
  src.replace(/\r/g,'').split('\n').forEach(function(raw){
    if(/^\s*#/.test(raw))return;
    var h=raw.match(/^\s*==\s*(.*?)\s*==\s*$/);
    if(h){cur={head:h[1],lines:[]};secs.push(cur);return}
    if(cur){cur.lines.push(raw.replace(/\s+$/,''));return}
    var m=raw.match(/^\s*([a-z][a-z _-]*?)\s*:\s*(.*?)\s*$/i);if(!m)return;
    var k=m[1].toLowerCase().replace(/[\s_-]+/g,' '),v=m[2];
    var CL={turns:[1,40],width:[6,80],thickness:[1,8],gap:[0,10],straight:[0,200],sway:[0,10]};
    var ck=k.match(/^cord (\w+)$/);
    if(ck&&CL[ck[1]]){var x=parseFloat(v),L=CL[ck[1]];if(!isNaN(x))P.cord[ck[1]]=Math.min(L[1],Math.max(L[0],x));return}
    if(k==='name'&&v)P.name=v;
    else if(k==='email')P.email=v;
    else if(k==='speed'){var n=parseFloat(v);if(n>0)P.speed=n}
    else if(k==='sound')P.sound=!/^(no|false|off|0)$/i.test(v);
    else if(k==='uppercase')P.upper=!/^(no|false|off|0)$/i.test(v);
    else if(k==='protected')P.protected=v.split(',').map(function(x){return x.trim().toLowerCase()}).filter(Boolean);
  });
  function up(t){return P.upper?t.toUpperCase():t}
  function lines(L){
    while(L.length&&!L[0].trim())L.shift();
    while(L.length&&!L[L.length-1].trim())L.pop();
    return L.map(function(l){
      var href=null,k=l.match(/^(.*?)\s+->\s*((?:https?:\/\/|mailto:)\S+)\s*$/i);
      if(k){l=k[1];href=k[2]}
      var m=l.match(/^(\s*)([~!])\s?(.*)$/),t=m?up(m[1]+m[3]):up(l),c=m?(m[2]==='~'?'dim':'err'):'';
      return href?[t,c,{href:href}]:(c?[t,c]:t);
    });
  }
  P.name=up(P.name);
  secs.forEach(function(sc){
    var hd=sc.head,body=lines(sc.lines),m;
    if(/^welcome$/i.test(hd))P.welcome=body;
    else if(/^about$/i.test(hd))P.about=body;
    else if(/^alias(es)?$/i.test(hd))sc.lines.forEach(function(l){
      var a=l.match(/^\s*([^=]+?)\s*=\s*(.+?)\s*$/);
      if(a)P.aliases.push({from:a[1].toLowerCase().split(/\s+/),to:a[2].toLowerCase()});
    });
    else if((m=hd.match(/^command\s*:\s*([^|]+?)\s*(?:\|\s*(.*))?$/i))){
      var names=m[1].split(',').map(function(x){return x.trim().toLowerCase()}).filter(Boolean);
      if(names.length)P.commands.push({names:names,help:up(m[2]||''),body:body});
    }
    else if((m=hd.match(/^file\s*:\s*(\S+)$/i))){
      var fn=m[1].toLowerCase();
      P.files.push({name:fn,body:body});
    }
    else if((m=hd.match(/^dir(?:ectory)?\s*:\s*(\S+)$/i)))P.dirs.push(m[1].toLowerCase());
  });
  if(!P.welcome)P.welcome=[up('welcome to '+P.name.toLowerCase()+'.'),[up('type help and press return.'),'dim']];
  return P;
})();

function $(s){return document.querySelector(s)}
var term=$('#term'),out=$('#out'),glow=$('#glow'),kb=$('#kb'),svg=$('#cable'),sway=$('#sway');
var cursor=document.createElement('span');cursor.className='cursor';
var coarse=window.matchMedia&&matchMedia('(pointer:coarse)').matches;
var chain=Promise.resolve(),ready=false,booted=false,buf='',bufNode=null,hist=[],hi=0;

function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
function queue(fn){chain=chain.then(fn).catch(function(e){console.error(e)});return chain}
function pause(ms){return queue(function(){return sleep(ms)})}

/* ---------- sound (keyclicks; WebAudio only, no files) ---------- */
var SND={ctx:null,noise:null,clicks:PROFILE.sound};
function actx(){
  if(!SND.ctx){
    var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
    var c=SND.ctx=new C(),n=(c.sampleRate*.03)|0,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);
    for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,6);
    SND.noise=b;
  }
  if(SND.ctx.state==='suspended')SND.ctx.resume();
  return SND.ctx;
}
/* browsers refuse audio before a real user gesture, so the boot is silent;
   the first tap/key quietly starts the sound hardware */
var GEST=['pointerdown','touchend','keydown','click'];
function unlockAudio(){
  if(!SND.clicks)return;
  var c=actx();
  if(c&&c.state==='running')GEST.forEach(function(t){document.removeEventListener(t,unlockAudio,true)});
}
GEST.forEach(function(t){document.addEventListener(t,unlockAudio,true)});
function click(vol,freq){
  if(!SND.clicks||!SND.ctx)return;
  var c=SND.ctx,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
  s.buffer=SND.noise;f.type='bandpass';f.frequency.value=freq||2200+Math.random()*1800;f.Q.value=1.4;
  g.gain.value=vol;s.connect(f);f.connect(g);g.connect(c.destination);s.start();
}

/* ---------- afterglow ---------- */
var lastG=0;
function afterglow(top,a,ms,force){
  var n=performance.now();
  if(!force&&(n-lastG<90||glow.childElementCount>2))return;
  lastG=n;
  var g=out.cloneNode(true);
  g.removeAttribute('id');g.className='ghost';
  var cs=g.querySelectorAll('.cursor');for(var i=0;i<cs.length;i++)cs[i].remove();
  g.style.transform='translateY('+(-top)+'px)';
  g.style.setProperty('--a',a);g.style.animationDuration=ms+'ms';
  g.addEventListener('animationend',function(){g.remove()});
  glow.appendChild(g);
}
function scrollBottom(){
  var b=term.scrollTop;term.scrollTop=term.scrollHeight;
  if(term.scrollTop-b>1)afterglow(b,.38,460);
}
function trim(){while(out.childElementCount>240)out.firstElementChild.remove()}

/* ---------- typing engine ---------- */
function UP(t){return PROFILE.upper?String(t).toUpperCase():t}
function typeLine(text,cls,cb,opt){
  opt=opt||{};text=UP(text);
  return queue(function(){return new Promise(function(res){
    var d=document.createElement('div'),host=d;
    d.className='line'+(cls?' '+cls:'');
    if(opt.href){host=document.createElement('a');host.href=opt.href;
      if(!/^mailto:/i.test(opt.href)){host.target='_blank';host.rel='noopener'}d.appendChild(host)}
    var t=document.createTextNode(opt.pre?UP(opt.pre):'');host.appendChild(t);
    d.appendChild(cursor);out.appendChild(d);trim();
    var sp=opt.speed||1,i=0;
    function step(){
      if(i>=text.length){scrollBottom();if(cb)cb();res();return}

  var E='#232723',C='#141715';
  while(sway.firstChild)sway.removeChild(sway.firstChild);
  segs.forEach(function(sg){if(!sg.front){sway.appendChild(path(d(sg.p),'#1a1d1b',sw+1));sway.appendChild(path(d(sg.p),'#0e100f',sw))}});
  sway.appendChild(path(cord,E,edge));sway.appendChild(path(cord,C,sw));
  segs.forEach(function(sg){if(sg.front){sway.appendChild(path(d(sg.p),'#2b302c',edge));sway.appendChild(path(d(sg.p),C,sw))}});
  sway.appendChild(path(tail,E,edge));sway.appendChild(path(tail,C,sw));
  /* idle sway at the coil bottom (cord sway setting), pivoting at the strain relief */
  svg.style.setProperty('--sa',(Math.atan(CORD.sway/Math.max(e[1],40))*180/Math.PI).toFixed(3)+'deg');
}
var raf=0;
function redraw(){cancelAnimationFrame(raf);raf=requestAnimationFrame(drawCable)}

/* visible height -> --app-h. On phones the soft keyboard shrinks the visual viewport but not
   100dvh, so without this the bottom of the monitor would sit behind the keyboard. */
var vv=window.visualViewport;
function fitViewport(){
  var h=vv?vv.height*(vv.scale||1):window.innerHeight; /* *scale: pinch-zoom must not shrink the rig */
  if(h>0)document.documentElement.style.setProperty('--app-h',Math.round(h)+'px');
  if(vv&&vv.offsetTop)window.scrollTo(0,0);
  term.scrollTop=term.scrollHeight; /* keep the prompt in view as the glass resizes */
  redraw();
}
fitViewport();
if(vv)vv.addEventListener('resize',fitViewport);
window.addEventListener('resize',fitViewport);
window.addEventListener('orientationchange',function(){setTimeout(fitViewport,250)});
drawCable();redraw();
window.addEventListener('load',redraw);
window.addEventListener('resize',redraw);
if(window.ResizeObserver)new ResizeObserver(redraw).observe(svg);

/* ---------- boot ---------- */
function boot(){
  setTimeout(function(){$('#crt').classList.add('lit')},1300);
  if(!coarse){try{kb.focus({preventScroll:true})}catch(e){}}
  pause(900); /* tube warm-up */
  banner();
  typeLine(USER,'',null,{pre:'login: ',hold:700,speed:2.2}); /* first visit: auto-login as guest */
  pause(450);
  welcome();
  queue(function(){booted=true});
  prompt();
}
function banner(){ /* terminal self-test; replayed after exit */
  var B=[
    ['PHOSPHOR-9 VIDEO TERMINAL  ROM V1.07'],
    ['(C) 1979  ALL RIGHTS RESERVED','dim'],
    [''],
    [row('MEMORY CHECK','16384 BYTES OK'),'',250],
    [row('PHOSPHOR BAKE','P1 / 525 LINES')],
    [row('HV RAIL','24 KV STABLE'),'',380],
    [row('HORIZ. SYNC','15.734 KHZ LOCKED')],
    [row('KEYBOARD','DETECTED (YOURS)'),'',300]
  ];
  B.forEach(function(l){typeLine(l[0],l[1],null,{speed:.5});if(l[2])pause(l[2])});
  typeLine('');
}
function welcome(){
  say(PROFILE.welcome);
  if(PROFILE.email)typeLine('you have mail.');
  if(coarse)typeLine('(tap the screen for a keyboard.)','dim');
}
boot();
})();
